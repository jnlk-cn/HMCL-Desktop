name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned scanner
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tool_dir"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$tool_dir" gitleaks
      - name: Scan all fetched history with redacted output
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --log-opts="--all --full-history" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color
